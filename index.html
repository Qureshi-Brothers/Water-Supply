};

/* ================= data layer ================= */
let sb = null;
if (!DEMO) sb = supabase.createClient(CFG.url, CFG.key);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Math.random().toString(36).slice(2)+Date.now());

/* ---- demo data (sirf dikhane ke liye) ---- */
const demo = { shops:[], profiles:[], recs:[], me:null };
function seedDemo(){
  const d = n => { const x = new Date(); x.setDate(x.getDate()-n); return dstr(x); };
  demo.shops = [

    {id:"s3", name:"Bismillah Tanki Service", phone:"03214445556", modules:{bottle:false,tank:true,plant:false}, active:false}
  ];
  demo.profiles = [
    {id:"a", email:"admin@demo.pk", name:"Admin", role:"admin", shop_id:null, active:true},
    {id:"o1", email:"malik@demo.pk", name:"Rashid", role:"owner", shop_id:"s1", active:true},
    {id:"w1", email:"imran@demo.pk", name:"Imran", role:"worker", shop_id:"s1", active:true},
    {id:"w2", email:"bilal@demo.pk", name:"Bilal", role:"worker", shop_id:"s1", active:true},
    {id:"o2", email:"saaf@demo.pk", name:"Tariq", role:"owner", shop_id:"s2", active:true},
    {id:"o3", email:"bismillah@demo.pk", name:"Naveed", role:"owner", shop_id:"s3", active:true}
  ];
  const R = (kind, day, data) => demo.recs.push({id:uid(), shop_id:"s1", kind, day, data, created_by:"o1"});
  const cu = [
    ["c1","Haji Aslam","03001112223","Gali 4, Makan 12","bottle",120],
    ["c2","Sajid Kiryana Store","03004445556","Main Bazar","bottle",110],
    ["c3","Baji Nasreen","03217778889","Gali 7, Makan 3","bottle",120],
    ["c4","Al-Noor School","03331234567","Model Colony","tank",2.5],
    ["c5","Chacha Hotel","03451239876","Chowk","tank",2.5],
    ["c6","Usman Sahab","03009998887","Gali 2, Makan 20","bottle",130]
  ];
  cu.forEach(c => demo.recs.push({id:c[0], shop_id:"s1", kind:"customer", day:d(30), data:{name:c[1],phone:c[2],addr:c[3],type:c[4],rate:c[5],deposit:c[4]==="bottle"?1000:0}, created_by:"o1"}));
  const del = (day,c,type,qty,ret,rate,paid,by) => R("delivery",day,{cust:c,type,qty,ret,rate,amount:qty*rate,paid,by});
  del(d(3),"c1","bottle",2,0,120,240,"Imran"); del(d(3),"c2","bottle",5,0,110,0,"Imran"); del(d(3),"c4","tank",1000,0,2.5,2500,"Bilal");
  del(d(2),"c3","bottle",1,0,120,0,"Imran"); del(d(2),"c5","tank",400,0,2.5,0,"Bilal"); del(d(2),"c6","bottle",2,0,130,260,"Imran");
  del(d(1),"c1","bottle",2,2,120,0,"Imran"); del(d(1),"c2","bottle",5,5,110,550,"Imran"); del(d(1),"c4","tank",1000,0,2.5,0,"Bilal");
  del(d(0),"c3","bottle",1,1,120,120,"Imran"); del(d(0),"c5","tank",400,0,2.5,1000,"Bilal"); del(d(0),"c2","bottle",4,5,110,0,"Imran");

  R("plant",d(1),{t:"prod",litres:3200,bottles:60}); R("plant",d(0),{t:"prod",litres:2800,bottles:52});
  R("plant",d(75),{t:"maint",item:"Filter"}); R("plant",d(200),{t:"maint",item:"Membrane"});
  R("sale",d(1),{qty:18,amount:900,note:""}); R("sale",d(0),{qty:22,amount:1100,note:""});

const api = {
  async session(){
    if (DEMO) return demo.me;
    const { data } = await sb.auth.getSession();
    if (!data.session) return null;
    const r = await sb.from("profiles").select("*").eq("id", data.session.user.id).maybeSingle();
    if (r.error) throw r.error;
    return r.data || { id:data.session.user.id, email:data.session.user.email, role:"none", active:true };
  },
  async login(email, pw){
    if (DEMO){ demo.me = demo.profiles.find(p => p.email === email) || null; if(!demo.me) throw new Error("Demo ID nahi mili"); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw new Error(L("Email ya password ghalat hai","Wrong email or password"));
  },
  async logout(){ if (DEMO) demo.me = null; else await sb.auth.signOut(); },
  async shop(id){
    if (DEMO) return demo.shops.find(s => s.id === id) || null;
    const r = await sb.from("shops").select("*").eq("id", id).maybeSingle(); if (r.error) throw r.error; return r.data;
  },
  async shops(){
    if (DEMO) return { shops: demo.shops.slice(), profiles: demo.profiles.slice() };
    const a = await sb.from("shops").select("*").order("created_at"); if (a.error) throw a.error;
    const b = await sb.from("profiles").select("*"); if (b.error) throw b.error;
    return { shops: a.data, profiles: b.data };
  },
  async newUser(email, pw){
    if (DEMO) return uid();
    const tmp = supabase.createClient(CFG.url, CFG.key, { auth:{ persistSession:false, autoRefreshToken:false, storageKey:"ps_tmp" } });
    const { data, error } = await tmp.auth.signUp({ email, password: pw });
    if (error) throw error;
    if (!data.user || (data.user.identities && data.user.identities.length === 0)) throw new Error(L("Yeh email pehle se bani hui hai","This email already exists"));
    return data.user.id;
  },
  async createShop(o){
    if (DEMO){ const s={id:uid(),name:o.name,phone:o.phone,modules:o.modules,active:true}; demo.shops.push(s); demo.profiles.push({id:uid(),email:o.email,name:o.owner,role:"owner",shop_id:s.id,active:true}); return; }
    const id = await this.newUser(o.email, o.pw);
    const s = await sb.from("shops").insert({ name:o.name, phone:o.phone, modules:o.modules }).select().single(); if (s.error) throw s.error;
    const p = await sb.from("profiles").insert({ id, email:o.email, name:o.owner, role:"owner", shop_id:s.data.id }); if (p.error) throw p.error;
  },
  async updateShop(id, patch){
    if (DEMO){ Object.assign(demo.shops.find(s => s.id === id), patch); return; }
    const r = await sb.from("shops").update(patch).eq("id", id); if (r.error) throw r.error;
  },
  async workers(shopId){
    if (DEMO) return demo.profiles.filter(p => p.shop_id === shopId && p.role === "worker");
    const r = await sb.from("profiles").select("*").eq("shop_id", shopId).eq("role","worker").order("created_at"); if (r.error) throw r.error; return r.data;
  },
  async createWorker(shopId, o){
    if (DEMO){ demo.profiles.push({id:uid(),email:o.email,name:o.name,role:"worker",shop_id:shopId,active:true}); return; }
    const id = await this.newUser(o.email, o.pw);
    const p = await sb.from("profiles").insert({ id, email:o.email, name:o.name, role:"worker", shop_id:shopId }); if (p.error) throw p.error;
  },
  async setProfileActive(id, active){
    if (DEMO){ demo.profiles.find(p => p.id === id).active = active; return; }
    const r = await sb.from("profiles").update({ active }).eq("id", id); if (r.error) throw r.error;
  },
  async records(shopId){
    if (DEMO) return demo.recs.filter(r => r.shop_id === shopId && !r.deleted_at).map(r => ({...r}));
    let out = [], from = 0;
    for(;;){
      const r = await sb.from("records").select("*").eq("shop_id", shopId).is("deleted_at", null).order("created_at").range(from, from+999);
      if (r.error) throw r.error;
      out = out.concat(r.data); if (r.data.length < 1000) break; from += 1000;
    }
    return out;
  },
  async add(shopId, kind, day, data){
    if (DEMO){ const r={id:uid(),shop_id:shopId,kind,day,data,created_by:demo.me.id}; demo.recs.push(r); return {...r}; }
    const r = await sb.from("records").insert({ shop_id:shopId, kind, day, data }).select().single(); if (r.error) throw r.error; return r.data;
  },
  async upd(id, data){
    if (DEMO){ demo.recs.find(r => r.id === id).data = data; return; }
    const r = await sb.from("records").update({ data }).eq("id", id); if (r.error) throw r.error;
  },
  async del(id){
    if (DEMO){ const x = demo.recs.find(r => r.id === id); if (x) x.deleted_at = new Date().toISOString(); return; }
    const r = await sb.rpc("soft_delete", { rec: id }); if (r.error) throw r.error;
    if (!r.data) throw new Error(L("Yeh delete karne ki ijazat nahi","Not allowed to delete this"));
  },
  /* admin: ek shop ke ya sab ke records, delete hue bhi */
  async allRecords(shopId){
    if (DEMO) return demo.recs.filter(r => !shopId || r.shop_id === shopId).map(r => ({...r}));
    let out = [], from = 0;
    for(;;){
      let q = sb.from("records").select("*").order("created_at").range(from, from+999);
      if (shopId) q = q.eq("shop_id", shopId);
      const r = await q; if (r.error) throw r.error;
      out = out.concat(r.data); if (r.data.length < 1000) break; from += 1000;
    }
    return out;
  },
  async restore(id){
    if (DEMO){ const x = demo.recs.find(r => r.id === id); if (x) x.deleted_at = null; return; }
    const r = await sb.rpc("restore_record", { rec: id }); if (r.error) throw r.error;
    if (!r.data) throw new Error(L("Wapas nahi aa saka","Could not restore"));
  }
};

/* ================= state ================= */
const S = { me:null, shop:null, recs:[], tab:"aaj", period:"m", q:"", admin:null, workers:[], loading:true };
const mods = () => (S.shop && S.shop.modules) || {};
const isOwner = () => S.me && S.me.role === "owner";
const supply = () => mods().bottle || mods().tank;
const of = kind => S.recs.filter(r => r.kind === kind);
const cust = id => S.recs.find(r => r.id === id);
function custStats(){
  const m = {};
  const g = id => m[id] || (m[id] = { bal:0, held:0 });
  for (const r of S.recs){
    if (r.kind === "delivery"){ const s = g(r.data.cust); s.bal += num(r.data.amount) - num(r.data.paid); if (r.data.type === "bottle") s.held += num(r.data.qty) - num(r.data.ret); }
    else if (r.kind === "payment") g(r.data.cust).bal -= num(r.data.amount);
  }
  return m;
}
function inPeriod(day){
  const t = today();
  if (S.period === "d") return day === t;
  if (S.period === "m") return day.slice(0,7) === t.slice(0,7);
  if (S.period === "pm"){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return day.slice(0,7) === dstr(d).slice(0,7); }
  return true;
}

/* ================= boot ================= */
async function boot(){
  S.loading = true; render();
  try{
    S.me = await api.session();
    if (S.me && S.me.role === "admin") S.admin = await api.shops();
    else if (S.me && S.me.shop_id){
      S.shop = await api.shop(S.me.shop_id);
      if (S.shop && S.shop.active && S.me.active){
        S.recs = await api.records(S.shop.id);
        if (isOwner()) S.workers = await api.workers(S.shop.id);
      }
    }
  }catch(err){ toast(err.message || String(err)); }
  S.loading = false; S.tab = "aaj"; render();
}

/* ================= render ================= */
function render(){
  const app = $("#app");
  const banner = DEMO ? `<div class="demo">${L("DEMO: yeh sirf namoona hai, data save nahi hota","DEMO: sample only, nothing is saved")}</div>` : "";
  if (S.loading){ app.innerHTML = banner + `<main><p class="mute">${L("Khul raha hai...","Loading...")}</p></main>`; return; }
  if (!S.me){ app.innerHTML = banner + vLogin(); return; }
  const langBtn = `<button class="hbtn" data-act="lang">${LANG === "en" ? "Roman" : "English"}</button>`;
  if (S.me.role === "admin"){
    app.innerHTML = banner + `<header><h1>${L("Admin Panel","Admin Panel")}<small>${e(S.me.email)}</small></h1>${langBtn}<button class="hbtn" data-act="logout">${L("Bahar","Logout")}</button></header><main>${vAdmin()}</main>`;
    return;
  }
  const blocked = !S.shop || !S.shop.active || !S.me.active || S.me.role === "none";
  if (blocked){
    app.innerHTML = banner + `<header><h1>${e(S.shop ? S.shop.name : "Paani Supply")}</h1>${langBtn}<button class="hbtn" data-act="logout">${L("Bahar","Logout")}</button></header>
    <main><div class="card"><h2>${L("Account band hai","Account is off")}</h2><p class="mute">${L("Yeh account abhi chalu nahi. Admin se rabta karein.","This account is not active. Please contact the admin.")}</p></div></main>`;
    return;
  }
  const tabs = [["aaj",L("Aaj","Today"),IC.home]];
  if (supply()) tabs.push(["cust",L("Grahak","Customers"),IC.users]);
  if (isOwner() && mods().plant) tabs.push(["plant","Plant",IC.plant]);
  if (isOwner()) tabs.push(["exp",L("Kharcha","Expense"),IC.cash],["his",L("Hisaab","Accounts"),IC.chart]);
  tabs.push(["more",L("Aur","More"),IC.more]);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = "aaj";
  const view = {aaj:vToday, cust:vCust, plant:vPlant, exp:vExp, his:vHisaab, more:vMore}[S.tab]();
  app.innerHTML = banner + `<header><h1>${e(S.shop.name)}<small>${e(S.me.name || S.me.email)} · ${isOwner() ? L("Malik","Owner") : L("Delivery wala","Delivery staff")}</small></h1>${langBtn}</header>
  <main>${view}</main>
  <nav><div class="in">${tabs.map(t => `<button class="${S.tab===t[0]?"on":""}" data-act="tab" data-v="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join("")}</div></nav>`;
}

/* ---------- Admin ---------- */

  return `<div class="tiles"><div class="tile"><b>${a.shops.length}</b><span>${L("Kul clients","Total clients")}</span></div><div class="tile good"><b>${a.shops.filter(s => s.active).length}</b><span>${L("Chalu","Active")}</span></div></div>
  <button class="btn wide" data-act="newShop">+ ${L("Naya client banayein","Add new client")}</button>
  <button class="btn wide ghost" data-act="adminBackup">${L("Sab clients ka backup utaarein","Download backup of all clients")}</button>
  ${cards || `<p class="mute">${L("Abhi koi client nahi. Upar wale button se pehla client banayein.","No clients yet. Use the button above to add the first one.")}</p>`}`;

function describe(r, cm){
  const d = r.data || {}, c = cm[d.cust] || "?";
  if (r.kind === "delivery") return `${c} · ${d.qty} ${d.type === "tank" ? "L" : L("botal","bottles")} · ${rs(d.amount)}`;
  if (r.kind === "payment") return `${c} · ${L("wasool","payment")} ${rs(d.amount)}`;
  if (r.kind === "expense") return `${L("Kharcha","Expense")}: ${d.cat} ${rs(d.amount)}`;
  if (r.kind === "sale") return `${L("Counter bikri","Counter sale")} ${rs(d.amount)}`;
  if (r.kind === "plant") return d.t === "maint" ? `${d.item} ${L("badla","changed")}` : `${L("Pani bana","Production")} ${d.litres} L`;
  if (r.kind === "customer") return `${L("Grahak","Customer")}: ${d.name}`;
  return r.kind;
}
async function sDeleted(shopId){
  const all = await api.allRecords(shopId), cm = {};
  all.filter(r => r.kind === "customer").forEach(c => cm[c.id] = c.data.name);
  const del = all.filter(r => r.deleted_at).sort((a, b) => String(b.deleted_at).localeCompare(String(a.deleted_at)));
  const s = S.admin.shops.find(x => x.id === shopId);
  sheet(`${L("Delete hui entries","Deleted entries")}: ${s ? s.name : ""}`, del.map(r => `<div class="row"><div class="g"><b>${e(describe(r, cm))}</b><small>${nice(r.day)} · ${L("delete hui","deleted")} ${nice(String(r.deleted_at).slice(0,10))}</small></div>
    <button class="btn sm" data-act="restore" data-id="${r.id}" data-shop="${shopId}">${L("Wapas layein","Restore")}</button></div>`).join("") || `<p class="mute">${L("Is client ki koi entry delete nahi hui.","This client has no deleted entries.")}</p>`);
}

    <button class="btn wide">${L("Client banayein","Create client")}</button></form>`);

/* ---------- Aaj ---------- */
function vToday(){
  const t = today(), m = mods();
  const dl = of("delivery").filter(r => r.day === t && (isOwner() || true));
  const bot = dl.filter(r => r.data.type === "bottle"), tk = dl.filter(r => r.data.type === "tank");
  const sum = (a, f) => a.reduce((x, r) => x + num(f(r)), 0);
  const pays = of("payment").filter(r => r.day === t);
  const cash = sum(dl, r => r.data.paid) + sum(pays, r => r.data.amount);
  const credit = sum(dl, r => num(r.data.amount) - num(r.data.paid));
  let tiles = "";
  if (m.bottle) tiles += `<div class="tile"><b>${sum(bot, r => r.data.qty)}</b><span>${L("Botal di","Bottles delivered")}</span></div><div class="tile"><b>${sum(bot, r => r.data.ret)}</b><span>${L("Khali wapas","Empties back")}</span></div>`;
  if (m.tank) tiles += `<div class="tile"><b>${sum(tk, r => r.data.qty).toLocaleString()}</b><span>${L("Litre tanki supply","Litres by tanker")}</span></div><div class="tile"><b>${tk.length}</b><span>${L("Tanki deliveries","Tanker drops")}</span></div>`;
  if (supply()) tiles += `<div class="tile good"><b>${rs(cash)}</b><span>${L("Aaj naqd mila","Cash today")}</span></div><div class="tile bad"><b>${rs(credit)}</b><span>${L("Aaj ka udhaar","Credit today")}</span></div>`;
  if (m.plant && isOwner()){
    const pr = of("plant").filter(r => r.day === t && r.data.t === "prod"), sl = of("sale").filter(r => r.day === t);
    tiles += `<div class="tile"><b>${sum(pr, r => r.data.litres).toLocaleString()}</b><span>${L("Litre pani bana","Litres produced")}</span></div><div class="tile good"><b>${rs(sum(sl, r => r.data.amount))}</b><span>${L("Plant counter bikri","Plant counter sales")}</span></div>`;
  }
  const rows = dl.slice().reverse().map(r => rowDelivery(r, true)).join("");
  return `<div class="mute" style="font-weight:700">${nice(t)}</div>
  <div class="tiles">${tiles}</div>
  ${supply() ? `<button class="btn wide" data-act="pick">+ ${L("Nayi delivery","New delivery")}</button>
  <div class="card"><h2>${L("Aaj ki deliveries","Today's deliveries")}</h2>${rows || `<p class="mute">${L("Aaj abhi koi delivery nahi likhi.","No deliveries recorded today.")}</p>`}</div>` : ""}`;
}
function rowDelivery(r, showName){
  const c = cust(r.data.cust), d = r.data;
  const what = d.type === "tank" ? `${num(d.qty).toLocaleString()} ${L("litre","litres")}` : `${d.qty} ${L("botal","bottles")}${num(d.ret) ? ` · ${d.ret} ${L("khali wapas","empties")}` : ""}`;
  const due = num(d.amount) - num(d.paid);
  return `<div class="row"><div class="g"><b>${showName ? e(c ? c.data.name : "?") : nice(r.day)}</b><small>${what}${d.by ? " · " + e(d.by) : ""}${showName ? "" : ""}</small></div>
  <div class="r">${rs(d.amount)}<br><span class="pill ${due > 0 ? "bad" : "good"}">${due > 0 ? L("Udhaar ","Due ") + rs(due) : L("Naqd","Paid")}</span></div>
  <button class="btn sm danger" data-act="del" data-id="${r.id}" aria-label="Delete">✕</button></div>`;
}

/* ---------- Grahak ---------- */
function vCust(){
  const st = custStats(), q = S.q.trim().toLowerCase();
  let list = of("customer").filter(c => !q || (c.data.name + " " + c.data.phone + " " + c.data.addr).toLowerCase().includes(q));
  list.sort((a, b) => a.data.name.localeCompare(b.data.name));
  const totalDue = of("customer").reduce((x, c) => x + Math.max(0, (st[c.id] || {}).bal || 0), 0);
  const rows = list.map(c => {
    const s = st[c.id] || { bal:0, held:0 };
    return `<div class="row tap" data-act="cust" data-id="${c.id}"><div class="g"><b>${e(c.data.name)}</b><small>${e(c.data.addr || c.data.phone || "")}${c.data.type === "bottle" ? ` · ${s.held} ${L("botal us ke paas","bottles held")}` : ` · ${L("tanki","tanker")}`}</small></div>
    <div class="r ${s.bal > 0 ? "bad" : ""}">${s.bal > 0 ? rs(s.bal) : `<span class="pill good">${L("Saaf","Clear")}</span>`}</div></div>`;
  }).join("");
  return `<div class="tiles"><div class="tile"><b>${of("customer").length}</b><span>${L("Kul grahak","Customers")}</span></div><div class="tile bad"><b>${rs(totalDue)}</b><span>${L("Kul udhaar","Total credit")}</span></div></div>
  <input id="q" type="search" placeholder="${L("Naam, phone ya gali se dhoondein","Search name, phone or street")}" value="${e(S.q)}" aria-label="Search">
  <button class="btn wide" data-act="newCust">+ ${L("Naya grahak","New customer")}</button>
  <div class="card" id="custList">${rows || `<p class="mute">${L("Koi grahak nahi mila.","No customers found.")}</p>`}</div>`;
}

  sheet(c ? L("Grahak badlein","Edit customer") : L("Naya grahak","New customer"), `<form class="f" data-form="cust" data-id="${c ? c.id : ""}">
    <div><label for="cu_n">${L("Naam","Name")}</label><input id="cu_n" name="name" value="${e(d.name)}" required></div>
    <div><label for="cu_p">${L("Phone (WhatsApp)","Phone (WhatsApp)")}</label><input id="cu_p" name="phone" inputmode="tel" value="${e(d.phone)}"></div>
    <div><label for="cu_a">${L("Pata / gali","Address")}</label><input id="cu_a" name="addr" value="${e(d.addr)}"></div>
    ${typeSel}
    <div class="two"><div><label for="cu_r">${L("Rate (fi botal ya fi litre)","Rate (per bottle or litre)")}</label><input id="cu_r" name="rate" inputmode="decimal" value="${e(d.rate ?? "")}" required></div>
    <div><label for="cu_d">${L("Security (botal)","Deposit")}</label><input id="cu_d" name="deposit" inputmode="decimal" value="${e(d.deposit ?? "")}"></div></div>
    <button class="btn wide">${L("Mehfooz karein","Save")}</button></form>`);

function sCust(id){
  const c = cust(id); if (!c) return;
  const s = custStats()[id] || { bal:0, held:0 };
  const hist = S.recs.filter(r => (r.kind === "delivery" || r.kind === "payment") && r.data.cust === id).slice().reverse().slice(0, 40);
  const rows = hist.map(r => r.kind === "delivery" ? rowDelivery(r, false) :
    `<div class="row"><div class="g"><b>${nice(r.day)}</b><small>${L("Paisa wasool","Payment received")}${r.data.by ? " · " + e(r.data.by) : ""}</small></div><div class="r good">${rs(r.data.amount)}</div><button class="btn sm danger" data-act="del" data-id="${r.id}" aria-label="Delete">✕</button></div>`).join("");
  sheet(c.data.name, `<p class="mute" style="margin-top:-6px">${e(c.data.addr || "")} ${c.data.phone ? "· " + e(c.data.phone) : ""}<br>${L("Rate","Rate")}: ${rs(c.data.rate)} ${c.data.type === "tank" ? L("fi litre","per litre") : L("fi botal","per bottle")}</p>
    <div class="tiles"><div class="tile ${s.bal > 0 ? "bad" : "good"}"><b>${rs(s.bal)}</b><span>${L("Baqaya (udhaar)","Balance due")}</span></div>
    ${c.data.type === "bottle" ? `<div class="tile"><b>${s.held}</b><span>${L("Botal us ke paas","Bottles held")}</span></div>` : `<div class="tile"><b>${rs(c.data.deposit)}</b><span>${L("Security","Deposit")}</span></div>`}</div>
    <div class="acts" style="margin:12px 0">
      <button class="btn sm" data-act="deliver" data-id="${id}">+ ${L("Delivery","Delivery")}</button>
      <button class="btn sm ghost" data-act="pay" data-id="${id}">${L("Paisa wasool","Take payment")}</button>
      ${c.data.phone ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(c, s)}">WhatsApp</a>` : ""}
      <button class="btn sm ghost" data-act="print" data-id="${id}">${L("Parchi","Print slip")}</button>
      <button class="btn sm ghost" data-act="editCust" data-id="${id}">${L("Badlein","Edit")}</button>
    </div>
    <div class="card"><h2>${L("Purana hisaab","History")}</h2>${rows || `<p class="mute">${L("Abhi koi entry nahi.","No entries yet.")}</p>`}</div>`);
}
function waNum(p){ let n = String(p || "").replace(/\D/g, ""); if (n.startsWith("0")) n = "92" + n.slice(1); return n; }
function waLink(c, s){
  const lines = [`*${S.shop.name}*`, `${L("Assalam o alaikum","Hello")} ${c.data.name},`, `${L("Aap ka baqaya","Your balance due")}: ${rs(s.bal)}`];
  if (c.data.type === "bottle") lines.push(`${L("Aap ke paas hamari botalen","Our bottles with you")}: ${s.held}`);
  lines.push(`${L("Tareekh","Date")}: ${nice(today())}`, L("Shukriya","Thank you"));
  return "https://wa.me/" + waNum(c.data.phone) + "?text=" + encodeURIComponent(lines.join("\n"));
}
function printSlip(id){
  const c = cust(id), s = custStats()[id] || { bal:0, held:0 };
  const hist = S.recs.filter(r => (r.kind === "delivery" || r.kind === "payment") && r.data.cust === id).slice(-12);
  $("#print").innerHTML = `<h3>${e(S.shop.name)}</h3><div style="text-align:center">${e(S.shop.phone || "")}</div><hr>
  <div>${e(c.data.name)}</div><div>${e(c.data.addr || "")}</div><div>${nice(today())}</div><hr>
  <table>${hist.map(r => r.kind === "delivery" ? `<tr><td>${nice(r.day).slice(0,5)} ${r.data.type === "tank" ? r.data.qty + "L" : r.data.qty + " botal"}</td><td>${Math.round(r.data.amount)}</td></tr>` : `<tr><td>${nice(r.day).slice(0,5)} wasool</td><td>-${Math.round(r.data.amount)}</td></tr>`).join("")}</table><hr>
  <table><tr><td><b>Baqaya</b></td><td><b>${rs(s.bal)}</b></td></tr>${c.data.type === "bottle" ? `<tr><td>Botal aap ke paas</td><td>${s.held}</td></tr>` : ""}</table><hr><div style="text-align:center">Shukriya</div>`;
  try { window.print(); } catch(_){ toast(L("Yahan print nahi chalta","Printing is not available here")); }
}
function fPick(){
  sheet(L("Grahak chunein","Choose customer"), `<input id="pq" type="search" placeholder="${L("Naam ya gali likhein","Type name or street")}" aria-label="Search"><div id="pickList" style="margin-top:8px">${pickRows("")}</div>`);
}
function pickRows(q){

/* ---------- Hisaab ---------- */
function vHisaab(){
  const m = mods(), N = MODN(), P = [["d",L("Aaj","Today")],["m",L("Is mahine","This month")],["pm",L("Pichla mahina","Last month")],["all",L("Sab","All")]];
  const dl = of("delivery").filter(r => inPeriod(r.day)), ex = of("expense").filter(r => inPeriod(r.day)), sl = of("sale").filter(r => inPeriod(r.day)), py = of("payment").filter(r => inPeriod(r.day));
  const sum = (a, f) => a.reduce((x, r) => x + num(f(r)), 0);
  const inc = { bottle: sum(dl.filter(r => r.data.type === "bottle"), r => r.data.amount), tank: sum(dl.filter(r => r.data.type === "tank"), r => r.data.amount), plant: sum(sl, r => r.data.amount) };
  const exp = { bottle:0, tank:0, plant:0, all:0 }; ex.forEach(r => exp[r.data.mod in exp ? r.data.mod : "all"] += num(r.data.amount));
  const act = ["bottle","tank","plant"].filter(k => m[k]);
  const tInc = act.reduce((x, k) => x + inc[k], 0), tExp = act.reduce((x, k) => x + exp[k], 0) + exp.all, profit = tInc - tExp;
  const cash = sum(dl, r => r.data.paid) + sum(py, r => r.data.amount) + (m.plant ? inc.plant : 0);
  const st = custStats(), due = of("customer").map(c => [c, (st[c.id] || {}).bal || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  const totalDue = due.reduce((x, d) => x + d[1], 0);
  const modRows = act.map(k => `<div class="row"><div class="g"><b>${N[k]}</b><small>${L("Bikri","Sales")} ${rs(inc[k])} · ${L("Kharcha","Expense")} ${rs(exp[k])}</small></div><div class="r ${inc[k] - exp[k] < 0 ? "bad" : "good"}">${rs(inc[k] - exp[k])}</div></div>`).join("") +
    (exp.all ? `<div class="row"><div class="g"><b>${L("Mushtarka kharcha","Shared expense")}</b></div><div class="r bad">-${rs(exp.all)}</div></div>` : "");
  const by = {}; dl.forEach(r => { const k = r.data.by || "-"; (by[k] = by[k] || { n:0, cash:0, amt:0 }); by[k].n++; by[k].cash += num(r.data.paid); by[k].amt += num(r.data.amount); });
  py.forEach(r => { const k = r.data.by || "-"; (by[k] = by[k] || { n:0, cash:0, amt:0 }); by[k].cash += num(r.data.amount); });
  const wr = Object.keys(by).map(k => `<div class="row"><div class="g"><b>${e(k)}</b><small>${by[k].n} ${L("deliveries","deliveries")} · ${L("maal","goods")} ${rs(by[k].amt)}</small></div><div class="r good">${rs(by[k].cash)}<br><small class="mute">${L("wasool","collected")}</small></div></div>`).join("");
  return `<div class="seg">${P.map(p => `<button class="${S.period === p[0] ? "on" : ""}" data-act="period" data-v="${p[0]}">${p[1]}</button>`).join("")}</div>
  <div class="tiles"><div class="tile"><b>${rs(tInc)}</b><span>${L("Kul bikri","Total sales")}</span></div><div class="tile bad"><b>${rs(tExp)}</b><span>${L("Kul kharcha","Total expense")}</span></div>
  <div class="tile ${profit < 0 ? "bad" : "good"}"><b>${rs(profit)}</b><span>${profit < 0 ? L("Nuqsan","Loss") : L("Munafa","Profit")}</span></div><div class="tile good"><b>${rs(cash)}</b><span>${L("Naqd haath mein aaya","Cash received")}</span></div></div>
  ${act.length > 1 || exp.all ? `<div class="card"><h2>${L("Har kaam ka alag munafa","Profit by work")}</h2>${modRows}</div>` : ""}
  ${supply() ? `<div class="card"><h2>${L("Kis ne kitna kaam kiya","Work by staff")}</h2>${wr || `<p class="mute">${L("Is muddat mein koi delivery nahi.","No deliveries in this period.")}</p>`}</div>
  <div class="card"><h2>${L("Udhaar walay grahak","Customers with credit")} · ${rs(totalDue)}</h2>${due.slice(0, 30).map(x => `<div class="row tap" data-act="cust" data-id="${x[0].id}"><div class="g"><b>${e(x[0].data.name)}</b><small>${e(x[0].data.addr || "")}</small></div><div class="r bad">${rs(x[1])}</div></div>`).join("") || `<p class="mute">${L("Kisi par udhaar nahi.","Nobody owes anything.")}</p>`}</div>` : ""}`;
}

    const c = cust(f.dataset.id), qty = num(o.qty), rate = num(o.rate);
    if (qty <= 0) throw new Error(L("Miqdaar likhein","Enter a quantity"));
    const data = { cust:c.id, type:c.data.type, qty, ret:num(o.ret), rate, amount:qty * rate, paid:num(o.paid), by:S.me.name || S.me.email };
    S.recs.push(await api.add(S.shop.id, "delivery", o.day || today(), data)); closeSheet(); render(); toast(L("Delivery likh di","Delivery saved"));
  },
  pay: async (o, f) => {
    if (num(o.amount) <= 0) throw new Error(L("Raqam likhein","Enter an amount"));
    S.recs.push(await api.add(S.shop.id, "payment", o.day || today(), { cust:f.dataset.id, amount:num(o.amount), by:S.me.name || S.me.email }));
    closeSheet(); render(); sCust(f.dataset.id); toast(L("Wasooli likh di","Payment saved"));
  },
  exp: async o => { S.recs.push(await api.add(S.shop.id, "expense", o.day || today(), { cat:o.cat, amount:num(o.amount), mod:o.mod, note:o.note.trim() })); closeSheet(); render(); toast(L("Kharcha likh diya","Expense saved")); },
  prod: async o => { S.recs.push(await api.add(S.shop.id, "plant", o.day || today(), { t:"prod", litres:num(o.litres), bottles:num(o.bottles) })); closeSheet(); render(); toast(L("Likh diya","Saved")); },
  sale: async o => { S.recs.push(await api.add(S.shop.id, "sale", o.day || today(), { qty:num(o.qty), amount:num(o.amount), note:"" })); closeSheet(); render(); toast(L("Likh diya","Saved")); },
  worker: async o => { await api.createWorker(S.shop.id, { name:o.name.trim(), email:o.email.trim(), pw:o.pw }); S.workers = await api.workers(S.shop.id); closeSheet(); render(); toast(L("Login ban gaya","Login created")); }
};
let busy = false;
document.addEventListener("click", async ev => {
  if (Date.now() < lockUntil) return;
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const fn = acts[el.dataset.act]; if (!fn) return;
  try { await fn(el, ev); } catch(err){ toast(err.message || String(err)); }
});
document.addEventListener("change", async ev => {
  const el = ev.target; if (el.dataset && el.dataset.act === "mod"){ try { await acts.mod(el); } catch(err){ el.checked = !el.checked; toast(err.message || String(err)); } }
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return; ev.preventDefault(); if (busy) return;
  const o = Object.fromEntries(new FormData(f).entries()), btn = f.querySelector("button:not([type=button])");
  const old = btn ? btn.textContent : "";
  busy = true; if (btn){ btn.disabled = true; btn.textContent = L("Ruk jayein, ho raha hai...","Please wait..."); }
  try { await forms[f.dataset.form](o, f); } catch(err){ toast(err.message || String(err)); }
  busy = false; if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = old; }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "q"){ S.q = el.value; const tmp = document.createElement("div"); tmp.innerHTML = vCust(); $("#custList").innerHTML = tmp.querySelector("#custList").innerHTML; }
  else if (el.id === "pq") $("#pickList").innerHTML = pickRows(el.value);
  else if (el.form && el.form.dataset.form === "deliver" && (el.name === "qty" || el.name === "rate")) $("#dv_amt").textContent = rs(num(el.form.qty.value) * num(el.form.rate.value));
});

if (DEMO) seedDemo();
boot();
</script>
